<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advice - English Quiz</title>
    
    <!-- Elegant Coding Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --btn-bg: rgba(0, 0, 0, 0.05);
            --btn-hover: rgba(0, 0, 0, 0.1);
            --card-bg: rgba(0, 0, 0, 0.02);
            --border-radius: 16px;
            --transition-speed: 0.3s;
            --correct-color: rgba(0, 200, 0, 0.8);
            --wrong-color: rgba(255, 50, 50, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fira Code', monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Fixed Top Left Logo */
        .quiz-logo {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 50px;
            height: auto;
            border-radius: 8px;
            z-index: 100;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: opacity var(--transition-speed) ease, transform var(--transition-speed) ease;
            position: relative;
        }

        /* Screen Management */
        .screen {
            display: none;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.5s ease forwards;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Typography & Elements */
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            text-align: center;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 0.9rem;
            color: #555;
            text-align: center;
            line-height: 1.5;
        }

        label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #333;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px 16px;
            background: #fff;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 12px;
            font-size: 0.9rem;
            outline: none;
            transition: border var(--transition-speed);
        }

        input[type="text"]:focus, textarea:focus {
            border: 1px solid rgba(0,0,0,0.3);
        }

        /* Unique Answer Text Area */
        textarea#answer-input {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            min-height: 120px;
            resize: vertical;
            line-height: 1.5;
            color: #000;
        }

        .btn {
            background: var(--btn-bg);
            color: var(--text-color);
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background var(--transition-speed), transform 0.1s ease;
        }

        .btn:hover {
            background: var(--btn-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .telegram-placeholder {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 10px;
            color: #999;
        }

        /* Question Card */
        .question-card {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .question-card p {
            text-align: left;
            color: #000;
            font-size: 0.9rem;
        }

        .feedback-area {
            min-height: 40px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
            color: #333;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Progress Map */
        .progress-map {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }
        .progress-dot {
            flex: 1;
            height: 6px;
            background: rgba(0,0,0,0.1);
            border-radius: 3px;
            transition: background 0.4s ease, transform 0.3s ease;
        }
        .progress-dot.correct {
            background: var(--correct-color);
            transform: scaleY(1.5);
        }
        .progress-dot.wrong {
            background: var(--wrong-color);
            transform: scaleY(1.5);
        }

        /* Floating Bubbles Animation */
        .bubble-container {
            position: absolute;
            left: 50%;
            bottom: 80px; /* Originate near the submit button */
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 1000;
            display: flex;
            gap: 8px;
        }

        .floating-bubble {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            opacity: 0;
            animation: floatUp 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .floating-bubble.correct {
            background: var(--correct-color);
            border: 1px solid rgba(0, 200, 0, 1);
        }
        .floating-bubble.wrong {
            background: var(--wrong-color);
            border: 1px solid rgba(255, 50, 50, 1);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-120px) scale(1.5); opacity: 0; }
        }

        .final-score {
            font-size: 2.5rem;
            font-weight: 600;
            text-align: center;
            margin: 20px 0;
        }

        .status-text {
            font-weight: 500;
            color: #000;
        }

    </style>
</head>
<body>

    <!-- Fixed Top Left Logo -->
    <img src="https://z-cdn-media.chatglm.cn/files/9a0973ea-6541-483a-a5e5-98f7c5d75ea6.jpg?auth_key=1886308142-852474841a6d4bc0a779e722128a4a4a-0-51c482fb78b1239fbb5164549d51f169" alt="Logo" class="quiz-logo">

    <div class="app-container">
        
        <!-- START SCREEN -->
        <div id="start-screen" class="screen active">
            <h1>Advice</h1>
            <p>Complete the sentence “b” so it means the same as the sentence “a”. Practice your English grammar!</p>
            <div>
                <label for="telegram-user">Enter your Telegram Username</label>
                <input type="text" id="telegram-user" placeholder="@username" required>
            </div>
            <button class="btn" id="start-btn">Start Quiz</button>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen" class="screen">
            <!-- Progress Map -->
            <div class="progress-map" id="progress-map"></div>

            <div style="display: flex; justify-content: center; align-items: center;">
                <span id="question-counter" style="font-size: 0.8rem; font-weight: 600;">Question 1/7</span>
            </div>
            
            <div class="question-card">
                <p id="sentence-a"></p>
            </div>

            <div>
                <label for="answer-input" id="sentence-b-label"></label>
                <textarea id="answer-input" placeholder="Type your full answer here..."></textarea>
            </div>

            <div class="feedback-area" id="feedback-area"></div>
            
            <button class="btn" id="submit-btn">Submit Answer</button>
            <button class="btn" id="next-btn" style="display: none;">Next Question</button>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="screen">
            <h1>Quiz Finished!</h1>
            <p id="result-message">You did a great job.</p>
            <div class="final-score" id="final-score">0/7</div>
            <p class="telegram-placeholder status-text" id="telegram-status">Sending your score to your teacher...</p>
            <button class="btn" id="restart-btn">Retake Quiz</button>
        </div>

    </div>

    <script>
        // ==========================================
        // TELEGRAM BOT CONFIGURATION
        // ==========================================
        const TELEGRAM_BOT_TOKEN = '8600205409:AAHxFVkLuoTL5pKoZOBkhK5spfomJv5zHzQ'; 
        const TELEGRAM_CHAT_ID = '7969710102'; 
        // ==========================================

        const quizData = [
            {
                sentenceA: '1.a. Private sectors should give equal treatment to their workers.',
                sentenceBLabel: "1.b. It's high time...",
                acceptableAnswers: [
                    'private sectors gave equal treatment to their workers',
                    'the private sector gave equal treatment to their workers',
                    'private sectors gave their workers equal treatment'
                ]
            },
            {
                sentenceA: '2.a. It is recommended for the government to protect their citizens',
                sentenceBLabel: '2.b. The government...',
                acceptableAnswers: [
                    'should protect their citizens',
                    'ought to protect their citizens',
                    'had better protect their citizens',
                    'must protect their citizens'
                ]
            },
            {
                sentenceA: '3.a. International health organizations should fight counterfeit medicines.',
                sentenceBLabel: "3.b. It's high time...",
                acceptableAnswers: [
                    'international health organizations fought counterfeit medicines',
                    'international organizations fought counterfeit medicines'
                ]
            },
            {
                sentenceA: '4.a. Government should impose severe laws on smugglers',
                sentenceBLabel: "4.b. It's high time...",
                acceptableAnswers: [
                    'governments imposed severe laws on smugglers',
                    'the government imposed severe laws on smugglers'
                ]
            },
            {
                sentenceA: '5.a. Governments should protect children from exploitation.',
                sentenceBLabel: "5.b. It's high time...",
                acceptableAnswers: [
                    'governments protected children from exploitation'
                ]
            },
            {
                sentenceA: '6.a. It is not advisable for businessmen to work unethically.',
                sentenceBLabel: '6.b. Businessmen...',
                acceptableAnswers: [
                    'had better not work unethically',
                    'should not work unethically',
                    'ought not to work unethically',
                    'had better work ethically'
                ]
            },
            {
                sentenceA: "7.a. If I were you, I wouldn't buy counterfeits.",
                sentenceBLabel: '7.b. You...',
                acceptableAnswers: [
                    "should not buy counterfeits",
                    "shouldnt buy counterfeits",
                    "had better not buy counterfeits",
                    "ought not to buy counterfeits"
                ]
            }
        ];

        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const startBtn = document.getElementById('start-btn');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        
        const usernameInput = document.getElementById('telegram-user');
        const answerInput = document.getElementById('answer-input');
        const sentenceA = document.getElementById('sentence-a');
        const sentenceBLabel = document.getElementById('sentence-b-label');
        const questionCounter = document.getElementById('question-counter');
        const feedbackArea = document.getElementById('feedback-area');
        const finalScore = document.getElementById('final-score');
        const resultMessage = document.getElementById('result-message');
        const telegramStatus = document.getElementById('telegram-status');
        const appContainer = document.querySelector('.app-container');
        const progressMap = document.getElementById('progress-map');

        // State Variables
        let currentQuestionIndex = 0;
        let score = 0;
        let studentUsername = '';

        // Build Progress Map
        function buildProgressMap() {
            progressMap.innerHTML = '';
            for(let i = 0; i < quizData.length; i++) {
                const dot = document.createElement('div');
                dot.className = 'progress-dot';
                progressMap.appendChild(dot);
            }
        }

        // Normalize text
        function normalizeText(text) {
            return text.toLowerCase()
                .replace(/\bhad not\b/g, "hadnt")
                .replace(/\bdid not\b/g, "didnt")
                .replace(/\bshould not\b/g, "shouldnt")
                .replace(/\bwere not\b/g, "werent")
                .replace(/\bwas not\b/g, "wasnt")
                .replace(/\bcould not\b/g, "couldnt")
                .replace(/\bwould not\b/g, "wouldnt")
                .replace(/\bought not to\b/g, "oughtntto")
                .replace(/\bhad better not\b/g, "hadbetternot")
                .replace(/hadn['’]t/g, "hadnt")
                .replace(/didn['’]t/g, "didnt")
                .replace(/shouldn['’]t/g, "shouldnt")
                .replace(/weren['’]t/g, "werent")
                .replace(/wasn['’]t/g, "wasnt")
                .replace(/couldn['’]t/g, "couldnt")
                .replace(/wouldn['’]t/g, "wouldnt")
                .replace(/you tube/gi, "youtube")
                .replace(/[""''""]/g, "")       
                .replace(/[.,/#!$%^&*;:{}=_`~()@?\[\]]/g, "")
                .replace(/\b(the|a|an)\b/g, "") 
                .replace(/\s{2,}/g, " ")
                .trim();
        }

        // Levenshtein distance
        function levenshtein(a, b) {
            if (a === b) return 0;
            const m = a.length, n = b.length;
            if (m === 0) return n;
            if (n === 0) return m;
            let prev = Array.from({ length: n + 1 }, (_, i) => i);
            let curr = new Array(n + 1);
            for (let i = 1; i <= m; i++) {
                curr[0] = i;
                for (let j = 1; j <= n; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    curr[j] = Math.min(curr[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
                }
                [prev, curr] = [curr, prev];
            }
            return prev[n];
        }

        // Check if student answer matches
        function isAnswerCorrect(userText, acceptableAnswers) {
            const normalized = normalizeText(userText);
            for (const ans of acceptableAnswers) {
                const normAns = normalizeText(ans);
                if (levenshtein(normalized, normAns) <= 2) return true;
            }
            return false;
        }

        // High-Quality Floating Bubbles Generator
        function createBubble(isCorrect) {
            const bubbleContainer = document.createElement('div');
            bubbleContainer.className = 'bubble-container';
            
            for(let i = 0; i < 8; i++) {
                const bubble = document.createElement('div');
                bubble.className = `floating-bubble ${isCorrect ? 'correct' : 'wrong'}`;
                bubble.style.animationDelay = `${i * 0.05}s`;
                bubbleContainer.appendChild(bubble);
            }

            appContainer.appendChild(bubbleContainer);
            
            setTimeout(() => {
                bubbleContainer.remove();
            }, 1500);
        }

        // Start Quiz Logic
        startBtn.addEventListener('click', async () => {
            if(usernameInput.value.trim() === '') {
                alert('Please enter your Telegram username to start.');
                return;
            }
            
            studentUsername = usernameInput.value.trim();
            if (!studentUsername.startsWith('@')) {
                studentUsername = '@' + studentUsername;
            }

            startBtn.disabled = true;
            startBtn.textContent = 'Checking username...';

            try {
                const response = await fetch(`/api/check-username?username=${encodeURIComponent(studentUsername)}`);
                const data = await response.json();
                
                if (!data.valid) {
                    alert('Username not found. Please make sure you clicked the bot link after payment to link your account.');
                    startBtn.disabled = false;
                    startBtn.textContent = 'Start Quiz';
                    return;
                }
            } catch (error) {
                alert('Error connecting to the server. Please try again.');
                startBtn.disabled = false;
                startBtn.textContent = 'Start Quiz';
                return;
            }

            startBtn.disabled = false;
            startBtn.textContent = 'Start Quiz';
            startScreen.classList.remove('active');
            quizScreen.classList.add('active');
            buildProgressMap(); // Initialize progress map
            loadQuestion();
        });

        // Load Question
        function loadQuestion() {
            const q = quizData[currentQuestionIndex];
            sentenceA.textContent = q.sentenceA;
            sentenceBLabel.textContent = q.sentenceBLabel;
            answerInput.value = '';
            
            questionCounter.textContent = `Question ${currentQuestionIndex + 1}/${quizData.length}`;
            
            feedbackArea.style.opacity = '0';
            feedbackArea.textContent = '';

            submitBtn.style.display = 'block';
            nextBtn.style.display = 'none';
            answerInput.focus();
        }

        // Submit Answer Logic
        submitBtn.addEventListener('click', () => {
            const userAnswer = answerInput.value.trim();
            if(userAnswer === '') {
                alert('Please type your answer.');
                return;
            }

            const acceptableAnswers = quizData[currentQuestionIndex].acceptableAnswers;
            const isCorrect = isAnswerCorrect(userAnswer, acceptableAnswers);

            createBubble(isCorrect);

            // Update Progress Map
            const dots = document.querySelectorAll('.progress-dot');
            if(isCorrect) {
                score++;
                dots[currentQuestionIndex].classList.add('correct');
                feedbackArea.textContent = 'Correct! Well done.';
                feedbackArea.style.color = 'green';
            } else {
                dots[currentQuestionIndex].classList.add('wrong');
                feedbackArea.textContent = `Wrong. Correct answer: "${acceptableAnswers[0]}"`;
                feedbackArea.style.color = 'red';
            }

            feedbackArea.style.opacity = '1';

            submitBtn.style.display = 'none';
            nextBtn.style.display = 'block';
        });

        // Next Question Logic
        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            if(currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        });

        // Show Results Logic
        function showResults() {
            quizScreen.classList.remove('active');
            resultScreen.classList.add('active');
            finalScore.textContent = `${score}/${quizData.length}`;
            
            if(score >= 5) {
                resultMessage.textContent = 'Excellent work! You mastered giving Advice.';
            } else if(score >= 3) {
                resultMessage.textContent = 'Good effort! Keep practicing.';
            } else {
                resultMessage.textContent = 'Needs improvement. Review the rules and try again!';
            }

            sendToTelegram();
        }

        // Telegram Integration Logic (uses backend API — no tokens exposed)
        async function sendToTelegram() {
            const percentageScore = ((score / quizData.length) * 100).toFixed(2);

            try {
                const response = await fetch('/api/send-quiz-result', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        quizName: 'Advice',
                        username: studentUsername,
                        score: percentageScore
                    })
                });

                const data = await response.json();

                if (data.success) {
                    telegramStatus.textContent = '✅ Score sent to your teacher successfully!';
                    telegramStatus.style.color = 'green';
                } else {
                    telegramStatus.textContent = '⚠️ Error sending score. Please inform your teacher.';
                    telegramStatus.style.color = 'red';
                }
            } catch (error) {
                telegramStatus.textContent = '⚠️ Network error. Could not send score.';
                telegramStatus.style.color = 'red';
            }
        }
        
        // Restart Logic
        restartBtn.addEventListener('click', () => {
            currentQuestionIndex = 0;
            score = 0;
            studentUsername = '';
            usernameInput.value = '';
            telegramStatus.textContent = 'Sending your score to your teacher...';
            telegramStatus.style.color = '#999';
            resultScreen.classList.remove('active');
            startScreen.classList.add('active');
        });

    </script>
</body>
</html>
